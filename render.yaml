services:
  - type: web
    name: personal-finance-manager
    env: docker
    plan: free
    dockerfilePath: Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: finance-postgres
          property: connectionString
      - key: COOKIE_SECURE
        value: true
      - key: SWAGGER_ENABLED
        value: true

databases:
  - name: finance-postgres
    plan: free
    databaseName: financedb
    user: financeuser
